name: crypto_admin
description: Crypto Albelhoushi admin app.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  supabase_flutter: ^2.5.2
  provider: ^6.1.2
  shared_preferences: ^2.3.2
  # 2.5.0+ crashes Android release builds because R8 strips JNI types.
  shared_preferences_android: '>=2.3.4 <2.5.0'

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

dependency_overrides:
  # app_links 6.4.1 requires a Flutter Gradle extension unavailable in Flutter 3.24.
  app_links: 6.4.0

flutter:
  uses-material-design: true
