<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة تحكم المدير - Crypto Balhoosi</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root {
            --bg-color: #0B0F1A;
            --surface-color: #121826;
            --primary-color: #00E5FF;
            --accent-color: #7C4DFF;
            --long-color: #16C784;
            --short-color: #EA3943;
            --gold-color: #FFC107;
            --text-low: #8A94A8;
            --text-high: #FFFFFF;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-high);
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }

        .container {
            max-width: 600px;
            margin: 0 auto;
            background: var(--surface-color);
            padding: 20px;
            border-radius: 16px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.5);
        }

        h2 {
            color: var(--primary-color);
            border-bottom: 2px solid var(--accent-color);
            padding-bottom: 8px;
            margin-bottom: 20px;
        }

        .section {
            margin-bottom: 25px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: var(--text-low);
            font-size: 14px;
        }

        input, select, textarea {
            width: 100%;
            padding: 12px;
            margin-bottom: 12px;
            background: #1A2234;
            border: 1px solid #2A364F;
            border-radius: 8px;
            color: #FFF;
            box-sizing: border-box;
            font-size: 14px;
        }

        input:focus, textarea:focus {
            outline: none;
            border-color: var(--primary-color);
        }

        button {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, var(--primary-color), var(--accent-color));
            border: none;
            border-radius: 8px;
            color: #000;
            font-weight: bold;
            font-size: 16px;
            cursor: pointer;
            transition: opacity 0.2s;
        }

        button:hover {
            opacity: 0.9;
        }

        .status-msg {
            margin-top: 10px;
            padding: 10px;
            border-radius: 6px;
            display: none;
            text-align: center;
        }

        .success { background: rgba(22, 199, 132, 0.2); color: var(--long-color); }
        .error { background: rgba(234, 57, 67, 0.2); color: var(--short-color); }
    </style>
</head>
<body>

<div class="container">
    <h2>لوحة تحكم المدير</h2>

    <!-- أسعار الاشتراكات -->
    <div class="section">
        <h3>أسعار الاشتراكات</h3>
        <label>السعر الشهري ($)</label>
        <input type="number" id="monthlyPrice" placeholder="مثال: 50">
        
        <label>السعر ربع السنوي ($)</label>
        <input type="number" id="quarterlyPrice" placeholder="مثال: 120">
        
        <label>السعر السنوي ($)</label>
        <input type="number" id="yearlyPrice" placeholder="مثال: 400">
        
        <button onclick="savePrices()">حفظ الأسعار</button>
    </div>

    <hr style="border-color: #2A364F; margin: 20px 0;">

    <!-- إرسال صفقة مجانية -->
    <div class="section">
        <h3 style="color: var(--gold-color);">إرسال صفقة مجانية للجميع 🎁</h3>
        
        <label>العملة</label>
        <input type="text" id="symbol" placeholder="BTCUSDT">

        <label>الاتجاه</label>
        <select id="tradeType">
            <option value="LONG">LONG (شراء)</option>
            <option value="SHORT">SHORT (بيع)</option>
        </select>

        <label>سعر الدخول</label>
        <input type="number" step="any" id="entryPrice" placeholder="65000">

        <label>وقف الخسارة (Stop Loss)</label>
        <input type="number" step="any" id="stopLoss" placeholder="63000">

        <label>الأهداف (مفصولة بفاصلة)</label>
        <input type="text" id="targets" placeholder="67000, 69000, 72000">

        <label>سبب الدخول / ملاحظات</label>
        <textarea id="reason" rows="2" placeholder="اختراقات واستمرار الاتجاه..."></textarea>

        <button onclick="sendFreeTrade()">إرسال الصفقة الآن</button>
    </div>

    <div id="statusMsg" class="status-msg"></div>
</div>

<script>
    const SUPABASE_URL = "https://gdsnaivwmdbuqktzrbin.supabase.co";
    const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imdkc25haXZ3bWRidXFrdHpyYmluIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTIxODI0NzAsImV4cCI6MjEwNzc1ODQ3MH0.cYsHuTE7XL8rR9M5PWIDPZhmE8Ntfvcnxdw5McR_f5w";
    const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    function showStatus(msg, isSuccess = true) {
        const el = document.getElementById('statusMsg');
        el.innerText = msg;
        el.className = 'status-msg ' + (isSuccess ? 'success' : 'error');
        el.style.display = 'block';
        setTimeout(() => { el.style.display = 'none'; }, 4000);
    }

    async function savePrices() {
        const m = document.getElementById('monthlyPrice').value;
        const q = document.getElementById('quarterlyPrice').value;
        const y = document.getElementById('yearlyPrice').value;

        if(!m || !q || !y) {
            showStatus("يرجى إدخال جميع الأسعار", false);
            return;
        }

        const { error } = await _supabase.from('settings').upsert({ id: 'prices', monthly: m, quarterly: q, yearly: y });
        if(error) showStatus("حدث خطأ في الحفظ: " + error.message, false);
        else showStatus("تم حفظ الأسعار بنجاح!");
    }

    async function sendFreeTrade() {
        const symbol = document.getElementById('symbol').value.toUpperCase();
        const type = document.getElementById('tradeType').value;
        const entry = parseFloat(document.getElementById('entryPrice').value);
        const sl = parseFloat(document.getElementById('stopLoss').value);
        const targets = document.getElementById('targets').value.split(',').map(t => parseFloat(t.trim()));
        const reason = document.getElementById('reason').value;

        if(!symbol || isNaN(entry) || isNaN(sl) || targets.length < 1) {
            showStatus("يرجى تعبئة كافة الحقول والأهداف بشكل صحيح", false);
            return;
        }

        const { error } = await _supabase.from('trades').insert([{
            symbol: symbol,
            is_long: type === 'LONG',
            entry: entry,
            stop_loss: sl,
            targets: targets,
            reason: reason,
            is_free: true
        }]);

        if(error) showStatus("حدث خطأ أثناء الإرسال: " + error.message, false);
        else showStatus("تم إرسال الصفقة بنجاح لجميع المستخدمين!");
    }
</script>

</body>
</html>
