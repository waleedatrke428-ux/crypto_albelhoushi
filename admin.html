<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة تحكم المدير</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { font-family: Tahoma, sans-serif; background: #0b0f19; color: #fff; margin: 0; padding: 20px; }
        .container { max-width: 700px; margin: 0 auto; background: #161b22; padding: 20px; border-radius: 12px; }
        h1, h2 { color: #00E5FF; text-align: center; }
        .card { background: #21262d; padding: 15px; margin: 10px 0; border-radius: 8px; border: 1px solid #30363d; }
        button { background: #00E5FF; color: #0b0f19; border: none; padding: 10px 15px; border-radius: 6px; cursor: pointer; font-weight: bold; width: 100%; margin-top: 10px; }
        input, select { width: 100%; padding: 10px; margin: 8px 0; background: #0d1117; border: 1px solid #30363d; color: #fff; border-radius: 6px; box-sizing: border-box; }
    </style>
</head>
<body>

    <div class="container">
        <h1>لوحة تحكم الأدمن 🛠️</h1>
        
        <div class="card">
            <h2>نشر توصية جديدة</h2>
            <input type="text" id="symbol" placeholder="اسم العملة (مثال: BTC/USDT)">
            <select id="is_long">
                <option value="true">شراء (Long 🟢)</option>
                <option value="false">بيع (Short 🔴)</option>
            </select>
            <input type="text" id="entry" placeholder="سعر الدخول">
            <input type="text" id="stop_loss" placeholder="وقف الخسارة">
            <button onclick="publishTrade()">نشر التوصية الآن</button>
        </div>
    </div>

    <script>
        const SUPABASE_URL = 'https://gdsnaivwmdbuqktzrbin.supabase.co';
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imdkc25aiXZ3bWRidXFrdHpyYmluIiwicm9sZSI6ImFub24iJlcXAiOjE3OTIxODI0NzAsImV4cCI6MjEwNzc1ODQ3MH0.cYsHuTE7XL8rR9M5PWIDPZhmE8Ntfvcnxdw5McR_f5w';
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        async function publishTrade() {
            const symbol = document.getElementById('symbol').value;
            const is_long = document.getElementById('is_long').value === 'true';
            const entry = document.getElementById('entry').value;
            const stop_loss = document.getElementById('stop_loss').value;

            if (!symbol || !entry) {
                alert('الرجاء إدخال اسم العملة وسعر الدخول على الأقل!');
                return;
            }

            const { data, error } = await supabaseClient.from('trades').insert([
                { symbol, is_long, entry, stop_loss }
            ]);

            if (error) {
                alert('حدث خطأ: ' + error.message);
            } else {
                alert('تم نشر التوصية بنجاح ووصلت للمستخدمين!');
                document.getElementById('symbol').value = '';
                document.getElementById('entry').value = '';
                document.getElementById('stop_loss').value = '';
            }
        }
    </script>
</body>
</html>
