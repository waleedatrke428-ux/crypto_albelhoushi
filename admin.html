<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة تحكم المدير - Crypto Albelhoushi</title>
    <!-- مكتبة Tailwind CSS للمظهر الداكن الاحترافي -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- مكتبة Supabase للاتصال بقاعدة البيانات -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <!-- خطوط الأيقونات FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        darkBg: '#0b0e11',
                        cardBg: '#1e2329',
                        accentGreen: '#0ecb81',
                        accentRed: '#f6465d'
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-darkBg text-gray-100 font-sans min-h-screen pb-12">

    <!-- شريط التنقل العلوي -->
    <header class="bg-cardBg border-b border-gray-800 p-4 sticky top-0 z-50 flex justify-between items-center shadow-md">
        <div class="flex items-center space-x-3 space-x-reverse">
            <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-yellow-500 to-emerald-500 flex items-center justify-center shadow-lg">
                <i class="fa-solid fa-robot text-darkBg text-xl"></i>
            </div>
            <div>
                <h1 class="font-bold text-lg tracking-wide text-white">لوحة تحكم الأدمن</h1>
                <p class="text-xs text-emerald-400 font-medium"><span class="inline-block w-2 h-2 rounded-full bg-emerald-500 animate-pulse ml-1"></span>الأتمتة الذكية والتحكم المالي</p>
            </div>
        </div>
        <div id="market-status-badge" class="text-xs px-3 py-1.5 rounded-full bg-gray-800 border border-gray-700 font-semibold text-gray-300">
            جاري فحص البورصات...
        </div>
    </header>

    <main class="max-w-4xl mx-auto p-4 space-y-6 mt-4">

        <!-- رسالة الحالة -->
        <div id="status-alert" class="hidden p-4 rounded-xl text-sm font-medium transition-all shadow-lg"></div>

        <!-- 1. إرسال صفقة مجانية استثنائية (للترويج) -->
        <section class="bg-cardBg border border-gray-800 rounded-2xl p-5 shadow-xl">
            <h2 class="text-base font-bold text-emerald-400 mb-4 flex items-center">
                <i class="fa-solid fa-bullhorn ml-2"></i> إرسال صفقة مجانية استثنائية (مفتوحة لجميع المستخدمين)
            </h2>
            <form id="free-signal-form" class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <div>
                    <label class="block text-xs text-gray-400 mb-1">العملة (مثال: BTC/USDT)</label>
                    <input type="text" id="free-pair" required class="w-full bg-darkBg border border-gray-700 rounded-xl p-3 text-sm text-white focus:border-emerald-500 focus:outline-none" placeholder="BTC/USDT">
                </div>
                <div>
                    <label class="block text-xs text-gray-400 mb-1">الاتجاه</label>
                    <select id="free-type" class="w-full bg-darkBg border border-gray-700 rounded-xl p-3 text-sm text-white focus:border-emerald-500 focus:outline-none">
                        <option value="LONG">شراء (LONG 🟢)</option>
                        <option value="SHORT">بيع (SHORT 🔴)</option>
                    </select>
                </div>
                <div>
                    <label class="block text-xs text-gray-400 mb-1">سعر الدخول</label>
                    <input type="text" id="free-entry" required class="w-full bg-darkBg border border-gray-700 rounded-xl p-3 text-sm text-white focus:border-emerald-500 focus:outline-none" placeholder="مثال: 68400">
                </div>
                <div>
                    <label class="block text-xs text-gray-400 mb-1">وقف الخسارة (Stop-Loss)</label>
                    <input type="text" id="free-sl" required class="w-full bg-darkBg border border-gray-700 rounded-xl p-3 text-sm text-white focus:border-emerald-500 focus:outline-none" placeholder="مثال: 67200">
                </div>
                <div class="md:col-span-2">
                    <label class="block text-xs text-gray-400 mb-1">أهداف جني الأرباح (TP1, TP2, TP3) مفصولة بفواصل</label>
                    <input type="text" id="free-tp" required class="w-full bg-darkBg border border-gray-700 rounded-xl p-3 text-sm text-white focus:border-emerald-500 focus:outline-none" placeholder="69000, 70200, 71500">
                </div>
                <div class="md:col-span-2">
                    <button type="submit" class="w-full bg-gradient-to-r from-emerald-600 to-teal-600 hover:from-emerald-500 hover:to-teal-500 text-white font-bold py-3 px-4 rounded-xl shadow-lg transition-all flex items-center justify-center space-x-2 space-x-reverse">
                        <i class="fa-solid fa-paper-plane"></i>
                        <span>نشر الصفقة المجانية الاستثنائية فوراً</span>
                    </button>
                </div>
            </form>
        </section>

        <!-- 2. الإدارة المالية وإعدادات الاشتراكات والدعم -->
        <section class="bg-cardBg border border-gray-800 rounded-2xl p-5 shadow-xl">
            <h2 class="text-base font-bold text-yellow-400 mb-4 flex items-center">
                <i class="fa-solid fa-wallet ml-2"></i> الإدارة المالية، أسعار الاشتراكات وطرق الدفع
            </h2>
            <div class="space-y-4">
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs text-gray-400 mb-1">سعر الاشتراك الشهري ($)</label>
                        <input type="number" id="sub-price" value="49" class="w-full bg-darkBg border border-gray-700 rounded-xl p-3 text-sm text-white focus:border-yellow-500 focus:outline-none">
                    </div>
                    <div>
                        <label class="block text-xs text-gray-400 mb-1">مدة الفترة التجريبية (بالأيام)</label>
                        <input type="number" id="trial-days" value="5" class="w-full bg-darkBg border border-gray-700 rounded-xl p-3 text-sm text-white focus:border-yellow-500 focus:outline-none">
                    </div>
                </div>
                <div>
                    <label class="block text-xs text-gray-400 mb-1">عناوين محافظ الدفع (USDT / TRC20 وغيرها)</label>
                    <textarea id="payment-wallets" rows="3" class="w-full bg-darkBg border border-gray-700 rounded-xl p-3 text-sm text-white focus:border-yellow-500 focus:outline-none" placeholder="أدخل تفاصيل ومحافظ الدفع...">USDT (TRC20): TYourWalletAddressHere123456</textarea>
                </div>
                <div>
                    <label class="block text-xs text-gray-400 mb-1">رابط الدعم الفني / التواصل (Telegram / WhatsApp)</label>
                    <input type="text" id="support-link" value="https://t.me/YourSupportChannel" class="w-full bg-darkBg border border-gray-700 rounded-xl p-3 text-sm text-white focus:border-yellow-500 focus:outline-none">
                </div>
                <button onclick="saveAdminSettings()" class="w-full bg-gray-800 hover:bg-gray-700 border border-gray-700 text-yellow-400 font-bold py-3 px-4 rounded-xl shadow transition-all">
                    حفظ إعدادات النظام المالي
                </button>
            </div>
        </section>

    </main>

    <script>
        // الاتصال المعتمد مع سوبابيس
        const SUPABASE_URL = 'https://gdsnaivwmdbuqktzrbin.supabase.co';
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imdkc25haXZ3bWRidXFrdHpyYmluIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTIxODI0NzAsImV4cCI6MjEwNzc1ODQ3MH0.cYsHuTE7XL8rR9M5PWIDPZhmE8Ntfvcnxdw5McR_f5w';
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        // إرسال صفقة مجانية استثنائية
        document.getElementById('free-signal-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const pair = document.getElementById('free-pair').value;
            const type = document.getElementById('free-type').value;
            const entry = document.getElementById('free-entry').value;
            const sl = document.getElementById('free-sl').value;
            const tp = document.getElementById('free-tp').value;

            const { data, error } = await supabaseClient.from('signals').insert([{
                pair: pair,
                type: type,
                entry: entry,
                stop_loss: sl,
                take_profits: tp,
                is_free: true, // صفقة مجانية استثنائية
                created_at: new Date()
            }]);

            const alertBox = document.getElementById('status-alert');
            alertBox.classList.remove('hidden');

            if (error) {
                alertBox.className = "p-4 rounded-xl text-sm font-medium bg-red-900/50 border border-red-700 text-red-200 shadow-lg";
                alertBox.innerHTML = `<i class="fa-solid fa-triangle-exclamation ml-2"></i> خطأ في النشر: ${error.message}`;
            } else {
                alertBox.className = "p-4 rounded-xl text-sm font-medium bg-emerald-900/50 border border-emerald-700 text-emerald-200 shadow-lg";
                alertBox.innerHTML = `<i class="fa-solid fa-circle-check ml-2"></i> تم نشر الصفقة المجانية الاستثنائية بنجاح للجميع!`;
                document.getElementById('free-signal-form').reset();
            }
        });

        function saveAdminSettings() {
            const settings = {
                price: document.getElementById('sub-price').value,
                trialDays: document.getElementById('trial-days').value,
                wallets: document.getElementById('payment-wallets').value,
                support: document.getElementById('support-link').value
            };
            localStorage.setItem('admin_system_settings', JSON.stringify(settings));
            alert('تم حفظ الإعدادات المالية ونظام الدعم بنجاح!');
        }

        // توقيت البورصات العالمية الحي
        function checkMarketSessions() {
            const now = new Date();
            const utcHours = now.getUTCHours();
            // بورصة نيويورك (13:00 - 21:00 UTC) و لندن (08:00 - 16:00 UTC) وتوكيو (00:00 - 08:00 UTC)
            const isLondonOpen = utcHours >= 8 && utcHours < 16;
            const isNewYorkOpen = utcHours >= 13 && utcHours < 21;
            
            const badge = document.getElementById('market-status-badge');
            if (isLondonOpen || isNewYorkOpen) {
                badge.className = "text-xs px-3 py-1.5 rounded-full bg-emerald-950 border border-emerald-800 font-semibold text-emerald-400";
                badge.innerHTML = `<span class="inline-block w-2 h-2 rounded-full bg-emerald-500 animate-pulse ml-1"></span> البورصات العالمية نشطة حالياً`;
            } else {
                badge.className = "text-xs px-3 py-1.5 rounded-full bg-amber-950 border border-amber-800 font-semibold text-amber-400";
                badge.innerHTML = `<span class="inline-block w-2 h-2 rounded-full bg-amber-500 ml-1"></span> البورصات الرئيسية مغلقة`;
            }
        }
        checkMarketSessions();
        setInterval(checkMarketSessions, 60000);
    </script>
</body>
  </html>
