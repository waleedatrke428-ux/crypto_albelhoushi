<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Crypto Albelhoushi - لوحة المدير المحمية</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='50' r='48' fill='%230f172a' stroke='%23f59e0b' stroke-width='4'/><path d='M35 30 L65 30 M35 50 L60 50 M35 70 L65 70 M45 20 L45 80' stroke='%23f59e0b' stroke-width='6' stroke-linecap='round'/></svg>">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --accent-gold: #f59e0b;
            --green: #10b981;
            --red: #ef4444;
            --text-color: #f8fafc;
        }
        * { user-select: none; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color); color: var(--text-color);
            margin: 0; padding: 12px; padding-bottom: 60px;
        }
        .card { background-color: var(--card-bg); padding: 16px; border-radius: 14px; margin-bottom: 16px; border: 1px solid #334155; }
        input, select, textarea, button {
            width: 100%; padding: 12px; margin: 6px 0; border-radius: 8px;
            border: 1px solid #475569; background-color: #0f172a; color: white; font-size: 0.9rem;
        }
        button { background-color: var(--accent-gold); color: #000; font-weight: bold; cursor: pointer; border: none; }
        .btn-ai { background: linear-gradient(135deg, #a855f7, #6366f1); color: #fff; }
        .markets-bar {
            display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px;
            background: #131c2e; padding: 10px; border-radius: 10px; margin-bottom: 15px; font-size: 0.8rem; border: 1px solid #334155;
        }
        .dev-footer {
            position: fixed; bottom: 0; left: 0; right: 0;
            background: #0f172a; border-top: 1px solid #334155;
            text-align: center; padding: 8px; font-size: 0.8rem;
            color: var(--accent-gold); font-weight: bold; z-index: 1000;
        }
    </style>
</head>
<body>

    <div id="adminAuth" class="card" style="max-width: 400px; margin: 40px auto; text-align: center;">
        <h2 style="color: var(--accent-gold);">🔐 بوابة دخول المدير</h2>
        <p style="color: #94a3b8; font-size: 0.85rem;">مخصص فقط للمطور: وليد تركي الحمد</p>
        <input type="email" id="adminEmail" placeholder="بريد المدير">
        <input type="password" id="adminPass" placeholder="كلمة المرور">
        <button onclick="loginAdmin()">دخول لوحة التحكم</button>
        <div id="adminMsg" style="color: var(--red); font-size: 0.85rem; margin-top: 10px;"></div>
    </div>

    <div id="adminPanel" style="display: none;">
        <div class="card" style="text-align: center;">
            <h2 style="margin:0; color:var(--accent-gold);">⚙️ لوحة التحكم والإدارة الذكية</h2>
            <button onclick="adminLogout()" style="background: transparent; color: var(--red); border: 1px solid var(--red); width: auto; padding: 5px 12px; margin-top: 8px; font-size: 0.75rem;">تسجيل خروج</button>
        </div>

        <div class="markets-bar">
            <div>🏛️ طوكيو: <span id="t-tokyo" style="color:var(--accent-gold)">--:--</span></div>
            <div>🏛️ لندن: <span id="t-london" style="color:var(--accent-gold)">--:--</span></div>
            <div>🏛️ نيويورك: <span id="t-ny" style="color:var(--accent-gold)">--:--</span></div>
            <div>🏛️ سيدني: <span id="t-sydney" style="color:var(--accent-gold)">--:--</span></div>
        </div>

        <div class="card">
            <h3 style="color:var(--accent-gold); margin-top:0;">🤖 توليد صفقة ذكية (Multi-Timeframe + SMC)</h3>
            <select id="aiPair">
                <option value="BTC/USDT">BTC/USDT</option>
                <option value="ETH/USDT">ETH/USDT</option>
                <option value="SOL/USDT">SOL/USDT</option>
            </select>
            <button class="btn-ai" onclick="runAI()">⚡ تحليل الفريمات الكبيرة وتوليد الصفقة</button>
        </div>

        <div class="card">
            <h3 style="color:var(--accent-gold); margin-top:0;">🚀 نشر الصفقة للمشتركين والتجريبيين</h3>
            <input type="text" id="symbol" placeholder="الزوج (مثال: BTC/USDT)">
            <input type="text" id="entry" placeholder="سعر الدخول (entry_price)">
            <input type="text" id="targets" placeholder="الأهداف (take_profit)">
            <input type="text" id="stopLoss" placeholder="وقف الخسارة (stop_loss)">
            <input type="text" id="timeframe" placeholder="الفريم (timeframe - مثال: 15M)">
            <button onclick="publishSignal()">📢 نشر وتعميم الصفقة فورياً</button>
        </div>
    </div>

    <div class="dev-footer">
        حقوق التطوير محفوظة للمطور: وليد تركي الحمد ©
    </div>

    <script>
        const SUPABASE_URL = 'https://gdsnaivwndtuqktzrbin.supabase.co';
        const SUPABASE_KEY = 'Sb_publishable_VbgMS_Y_oNs8rbMhVs1Tpg_9GJbP-gl';
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        const ADMIN_EMAIL = 'waleedatrke428@gmail.com';

        supabaseClient.auth.getSession().then(({ data: { session } }) => {
            if (session && session.user.email === ADMIN_EMAIL) {
                showAdminPanel();
            }
        });

        async function loginAdmin() {
            const email = document.getElementById('adminEmail').value;
            const password = document.getElementById('adminPass').value;
            document.getElementById('adminMsg').innerText = '';

            if (email !== ADMIN_EMAIL) {
                document.getElementById('adminMsg').innerText = 'عذراً، هذا البريد ليس لديه صلاحيات المدير!';
                return;
            }

            let { data, error } = await supabaseClient.auth.signInWithPassword({ email, password });
            if (error) {
                document.getElementById('adminMsg').innerText = 'خطأ في كلمة المرور أو البريد!';
            } else {
                showAdminPanel();
            }
        }

        function showAdminPanel() {
            document.getElementById('adminAuth').style.display = 'none';
            document.getElementById('adminPanel').style.display = 'block';
        }

        async function adminLogout() {
            await supabaseClient.auth.signOut();
            location.reload();
        }

        function updateClocks() {
            const opt = { hour: '2-digit', minute: '2-digit', hour12: false };
            document.getElementById('t-tokyo').innerText = new Date().toLocaleTimeString('en-US', { ...opt, timeZone: 'Asia/Tokyo' });
            document.getElementById('t-london').innerText = new Date().toLocaleTimeString('en-US', { ...opt, timeZone: 'Europe/London' });
            document.getElementById('t-ny').innerText = new Date().toLocaleTimeString('en-US', { ...opt, timeZone: 'America/New_York' });
            document.getElementById('t-sydney').innerText = new Date().toLocaleTimeString('en-US', { ...opt, timeZone: 'Australia/Sydney' });
        }
        setInterval(updateClocks, 1000); updateClocks();

        function runAI() {
            let pair = document.getElementById('aiPair').value;
            let base = pair.includes('BTC') ? 68000 : (pair.includes('ETH') ? 2650 : 160);
            document.getElementById('symbol').value = pair;
            document.getElementById('entry').value = (base * 0.995).toFixed(2);
            document.getElementById('targets').value = `${(base * 1.015).toFixed(2)}, ${(base * 1.03).toFixed(2)}`;
            document.getElementById('stopLoss').value = (base * 0.985).toFixed(2);
            document.getElementById('timeframe').value = '15M / SMC';
            alert('✅ تم التحليل وتعبئة الصفقة بنجاح!');
        }

        async function publishSignal() {
            let symbol = document.getElementById('symbol').value;
            let entry_price = document.getElementById('entry').value;
            let take_profit = document.getElementById('targets').value;
            let stop_loss = document.getElementById('stopLoss').value;
            let timeframe = document.getElementById('timeframe').value;

            if(!entry_price) {
                alert('الرجاء ملء سعر الدخول على الأقل');
                return;
            }

            let { error } = await supabaseClient.from('signals').insert([{ symbol, entry_price, take_profit, stop_loss, timeframe }]);
            if (error) {
                alert('خطأ أثناء النشر: ' + error.message);
            } else {
                alert('🚀 تم نشر الصفقة بنجاح ورؤيتها فورياً في جدول Supabase والتطبيق!');
                document.getElementById('symbol').value = '';
                document.getElementById('entry').value = '';
                document.getElementById('targets').value = '';
                document.getElementById('stopLoss').value = '';
                document.getElementById('timeframe').value = '';
            }
        }
    </script>
</body>
            </html>
