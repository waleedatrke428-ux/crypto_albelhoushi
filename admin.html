<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة تحكم المدير - Crypto Albelhoushi</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: { darkBg: '#0b0e11', cardBg: '#1e2329', accentGreen: '#0ecb81', accentRed: '#f6465d' }
                }
            }
        }
    </script>
</head>
<body class="bg-darkBg text-gray-100 font-sans min-h-screen pb-12">
    <header class="bg-cardBg border-b border-gray-800 p-4 sticky top-0 z-50 flex justify-between items-center shadow-md">
        <div class="flex items-center space-x-3 space-x-reverse">
            <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-yellow-500 to-emerald-500 flex items-center justify-center shadow-lg">
                <i class="fa-solid fa-robot text-darkBg text-xl"></i>
            </div>
            <div>
                <h1 class="font-bold text-lg text-white">لوحة تحكم الأدمن</h1>
                <p class="text-xs text-emerald-400 font-medium">نظام الأتمتة والتحكم المالي</p>
            </div>
        </div>
        <div id="market-status-badge" class="text-xs px-3 py-1.5 rounded-full bg-gray-800 border border-gray-700 font-semibold text-gray-300">
            جاري فحص البورصات...
        </div>
    </header>

    <main class="max-w-4xl mx-auto p-4 space-y-6 mt-4">
        <div id="status-alert" class="hidden p-4 rounded-xl text-sm font-medium shadow-lg"></div>

        <section class="bg-cardBg border border-gray-800 rounded-2xl p-5 shadow-xl">
            <h2 class="text-base font-bold text-emerald-400 mb-4 flex items-center">
                <i class="fa-solid fa-bullhorn ml-2"></i> إرسال صفقة مجانية استثنائية (مفتوحة للجميع)
            </h2>
            <form id="free-signal-form" class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <div>
                    <label class="block text-xs text-gray-400 mb-1">العملة (مثال: BTC/USDT)</label>
                    <input type="text" id="free-symbol" required class="w-full bg-darkBg border border-gray-700 rounded-xl p-3 text-sm text-white focus:border-emerald-500 focus:outline-none" placeholder="BTC/USDT">
                </div>
                <div>
                    <label class="block text-xs text-gray-400 mb-1">الاتجاه</label>
                    <select id="free-type" class="w-full bg-darkBg border border-gray-700 rounded-xl p-3 text-sm text-white focus:border-emerald-500 focus:outline-none">
                        <option value="LONG">شراء (LONG 🟢)</option>
                        <option value="SHORT">بيع (SHORT 🔴)</option>
                    </select>
                </div>
                <div>
                    <label class="block text-xs text-gray-400 mb-1">سعر الدخول</label>
                    <input type="text" id="free-entry" required class="w-full bg-darkBg border border-gray-700 rounded-xl p-3 text-sm text-white focus:border-emerald-500 focus:outline-none" placeholder="مثال: 68400">
                </div>
                <div>
                    <label class="block text-xs text-gray-400 mb-1">أهداف جني الأرباح (TP)</label>
                    <input type="text" id="free-tp" required class="w-full bg-darkBg border border-gray-700 rounded-xl p-3 text-sm text-white focus:border-emerald-500 focus:outline-none" placeholder="69000, 70200, 71500">
                </div>
                <div class="md:col-span-2">
                    <button type="submit" class="w-full bg-gradient-to-r from-emerald-600 to-teal-600 hover:opacity-90 text-white font-bold py-3 px-4 rounded-xl shadow-lg transition-all flex items-center justify-center space-x-2 space-x-reverse">
                        <i class="fa-solid fa-paper-plane"></i>
                        <span>نشر الصفقة الفورية الآن</span>
                    </button>
                </div>
            </form>
        </section>
    </main>

    <script>
        const SUPABASE_URL = 'https://gdsnaivwmdbuqktzrbin.supabase.co';
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imdkc25haXZ3bWRidXFrdHpyYmluIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTIxODI0NzAsImV4cCI6MjEwNzc1ODQ3MH0.cYsHuTE7XL8rR9M5PWIDPZhmE8Ntfvcnxdw5McR_f5w';
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        document.getElementById('free-signal-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const symbol = document.getElementById('free-symbol').value;
            const type = document.getElementById('free-type').value;
            const entry = document.getElementById('free-entry').value;
            const tp = document.getElementById('free-tp').value;

            const { data, error } = await supabaseClient.from('signals').insert([{
                symbol: symbol,
                type: type,
                entry_price: entry,
                take_profit: tp,
                is_free: true,
                created_at: new Date()
            }]);

            const alertBox = document.getElementById('status-alert');
            alertBox.classList.remove('hidden');

            if (error) {
                alertBox.className = "p-4 rounded-xl text-sm font-medium bg-red-900/50 border border-red-700 text-red-200 shadow-lg";
                alertBox.innerHTML = `<i class="fa-solid fa-triangle-exclamation ml-2"></i> خطأ في النشر: ${error.message}`;
            } else {
                alertBox.className = "p-4 rounded-xl text-sm font-medium bg-emerald-900/50 border border-emerald-700 text-emerald-200 shadow-lg";
                alertBox.innerHTML = `<i class="fa-solid fa-circle-check ml-2"></i> تم نشر الصفقة بنجاح في قاعدة البيانات!`;
                document.getElementById('free-signal-form').reset();
            }
        });
    </script>
</body>
    </html>
