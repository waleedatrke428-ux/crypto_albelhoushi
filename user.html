<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تطبيق التوصيات - Crypto Balhoosi</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root {
            --bg-color: #0B0F1A;
            --surface-color: #121826;
            --surface-hi: #1F2A3E;
            --primary-color: #00E5FF;
            --accent-color: #7C4DFF;
            --long-color: #16C784;
            --short-color: #EA3943;
            --gold-color: #FFC107;
            --text-low: #8A94A8;
            --text-high: #FFFFFF;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-high);
            margin: 0;
            padding: 16px;
            box-sizing: border-box;
        }

        .header {
            text-align: center;
            padding: 10px 0 20px 0;
        }

        .header h1 {
            color: var(--primary-color);
            margin: 0;
            font-size: 24px;
        }

        .header p {
            color: var(--text-low);
            font-size: 14px;
            margin-top: 5px;
        }

        .plans-card {
            background: linear-gradient(135deg, rgba(124, 77, 255, 0.15), rgba(0, 229, 255, 0.15));
            border: 1px solid var(--accent-color);
            border-radius: 16px;
            padding: 16px;
            margin-bottom: 24px;
            text-align: center;
        }

        .plans-card h3 {
            margin-top: 0;
            color: var(--gold-color);
        }

        .plans-grid {
            display: flex;
            justify-content: space-around;
            gap: 10px;
            margin-top: 15px;
        }

        .plan-item {
            background: var(--surface-color);
            padding: 10px;
            border-radius: 10px;
            flex: 1;
            border: 1px solid rgba(255,255,255,0.05);
        }

        .plan-title { font-size: 12px; color: var(--text-low); }
        .plan-price { font-size: 18px; font-weight: bold; color: var(--primary-color); margin-top: 5px; }

        .trades-title {
            font-size: 18px;
            margin-bottom: 12px;
            border-right: 4px solid var(--primary-color);
            padding-right: 8px;
        }

        .trade-card {
            background: var(--surface-color);
            border-radius: 14px;
            padding: 16px;
            margin-bottom: 14px;
            border: 1px solid rgba(255,255,255,0.05);
            position: relative;
        }

        .trade-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }

        .symbol { font-weight: bold; font-size: 18px; }
        
        .badge {
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: bold;
        }
        .badge-long { background: rgba(22, 199, 132, 0.2); color: var(--long-color); }
        .badge-short { background: rgba(234, 57, 67, 0.2); color: var(--short-color); }
        .badge-free { background: rgba(255, 193, 7, 0.2); color: var(--gold-color); border: 1px solid var(--gold-color); }

        .trade-details {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            font-size: 14px;
            margin-bottom: 10px;
        }

        .detail-label { color: var(--text-low); font-size: 12px; }
        .detail-val { font-weight: 500; }

        .targets-list {
            background: var(--surface-hi);
            padding: 10px;
            border-radius: 8px;
            font-size: 13px;
        }

        .locked-overlay {
            background: rgba(18, 24, 38, 0.95);
            border-radius: 14px;
            padding: 20px;
            text-align: center;
            border: 1px dashed var(--accent-color);
        }

        .locked-overlay button {
            background: linear-gradient(135deg, var(--gold-color), #FF9800);
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            color: #000;
            font-weight: bold;
            margin-top: 10px;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <div class="header">
        <h1>منصة Crypto Balhoosi</h1>
        <p>التوصيات والتحليلات المباشرة</p>
    </div>

    <!-- كارت الاشتراكات -->
    <div class="plans-card">
        <h3>الاشتراكات المميزة 🌟</h3>
        <p style="font-size: 13px; color: var(--text-low); margin: 0;">اشترك الآن للحصول على التوصيات الخاصة واللحظية</p>
        <div class="plans-grid">
            <div class="plan-item">
                <div class="plan-title">شهري</div>
                <div class="plan-price" id="mPrice">$--</div>
            </div>
            <div class="plan-item">
                <div class="plan-title">3 أشهر</div>
                <div class="plan-price" id="qPrice">$--</div>
            </div>
            <div class="plan-item">
                <div class="plan-title">سنوي</div>
                <div class="plan-price" id="yPrice">$--</div>
            </div>
        </div>
    </div>

    <!-- قائمة التوصيات -->
    <div class="trades-title">أحدث التوصيات</div>
    <div id="tradesContainer">
        <div style="text-align: center; color: var(--text-low); padding: 20px;">جاري تحميل التوصيات...</div>
    </div>

<script>
    const SUPABASE_URL = "https://gdsnaivwmdbuqktzrbin.supabase.co";
    const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imdkc25haXZ3bWRidXFrdHpyYmluIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTIxODI0NzAsImV4cCI6MjEwNzc1ODQ3MH0.cYsHuTE7XL8rR9M5PWIDPZhmE8Ntfvcnxdw5McR_f5w";
    const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    async function loadPrices() {
        const { data, error } = await _supabase.from('settings').select('*').eq('id', 'prices').single();
        if(data) {
            document.getElementById('mPrice').innerText = '$' + data.monthly;
            document.getElementById('qPrice').innerText = '$' + data.quarterly;
            document.getElementById('yPrice').innerText = '$' + data.yearly;
        }
    }

    async function loadTrades() {
        const container = document.getElementById('tradesContainer');
        const { data: trades, error } = await _supabase.from('trades').select('*').order('created_at', { ascending: false });

        if(error || !trades || trades.length === 0) {
            container.innerHTML = '<div style="text-align: center; color: var(--text-low); padding: 20px;">لا يوجد توصيات حالية.</div>';
            return;
        }

        container.innerHTML = '';
        trades.forEach(trade => {
            const isLong = trade.is_long;
            const isFree = trade.is_free;

            if (!isFree) {
                // صفقة مدفوعة مقفولة
                container.innerHTML += `
                    <div class="trade-card">
                        <div class="locked-overlay">
                            <div style="font-size: 24px;">🔒</div>
                            <div style="font-weight: bold; margin-top: 5px;">توصية خاصة بالمشتركين</div>
                            <div style="font-size: 12px; color: var(--text-low); margin-top: 4px;">اشترك في القناة الذهبية لمشاهدة التفاصيل</div>
                            <button onclick="alert('تواصل مع الادارة للاشتراك!')">اشترك الآن</button>
                        </div>
                    </div>
                `;
            } else {
                // صفقة مجانية مفتوحة
                const targetsText = Array.isArray(trade.targets) ? trade.targets.join(' | ') : trade.targets;
                container.innerHTML += `
                    <div class="trade-card">
                        <div class="trade-header">
                            <div>
                                <span class="symbol">${trade.symbol}</span>
                                <span class="badge ${isLong ? 'badge-long' : 'badge-short'}">${isLong ? 'شراء LONG' : 'بيع SHORT'}</span>
                            </div>
                            <span class="badge badge-free">مجانية 🎁</span>
                        </div>
                        <div class="trade-details">
                            <div>
                                <div class="detail-label">سعر الدخول</div>
                                <div class="detail-val">${trade.entry}</div>
                            </div>
                            <div>
                                <div class="detail-label">وقف الخسارة (SL)</div>
                                <div class="detail-val" style="color: var(--short-color);">${trade.stop_loss}</div>
                            </div>
                        </div>
                        <div class="targets-list">
                            <span style="color: var(--gold-color); font-weight: bold;">الأهداف: </span> ${targetsText}
                        </div>
                        ${trade.reason ? `<div style="font-size: 12px; color: var(--text-low); margin-top: 8px;">💡 ${trade.reason}</div>` : ''}
                    </div>
                `;
            }
        });
    }

    loadPrices();
    loadTrades();
</script>

</body>
</html>
