<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تطبيق التوصيات المباشرة</title>
    <!-- مكتبة Supabase للاتصال الفوري -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { font-family: Tahoma, sans-serif; background-color: #0B0F1A; color: #FFF; margin: 0; padding: 16px; text-align: center; }
        .trade-card { background: #121826; border-radius: 12px; padding: 16px; margin-bottom: 12px; border: 1px solid #00E5FF; animation: fadeIn 0.5s; text-align: right; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(-10px); } to { opacity: 1; transform: translateY(0); } }
        .symbol { font-size: 20px; font-weight: bold; color: #00E5FF; }
        .badge-long { color: #16C784; font-weight: bold; float: left; }
        .badge-short { color: #EA3943; font-weight: bold; float: left; }
        .live-status { color: #FFC107; font-size: 13px; margin-bottom: 15px; }
    </style>
</head>
<body>

    <h1>التوصيات الفورية</h1>
    <div class="live-status">🟢 متصل بنظام الإشارات المباشر (تحديث لحظي)</div>
    
    <div id="tradesContainer">
        <div style="color: #8A94A8; padding: 20px; text-align: center;">بانتظار وصول التوصيات...</div>
    </div>

<script>
    // معلومات الاتصال بقاعدة بيانات Supabase الخاصة بك
    const SUPABASE_URL = "https://gdsnaivwmdbuqktzrbin.supabase.co";
    const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imdkc25haXZ3bWRidXFrdHpyYmluIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTIxODI0NzAsImV4cCI6MjEwNzc1ODQ3MH0.cYsHuTE7XL8rR9M5PWIDPZhmE8Ntfvcnxdw5McR_f5w";
    
    const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    // دالة لعرض التوصيات على شاشة المستخدم
    function renderTrades(trades) {
        const container = document.getElementById('tradesContainer');
        if (!trades || trades.length === 0) {
            container.innerHTML = '<div style="color: #8A94A8; padding: 20px; text-align: center;">لا توجد توصيات حالياً.</div>';
            return;
        }

        container.innerHTML = '';
        trades.forEach(trade => {
            const isLong = trade.is_long;
            container.innerHTML += `
                <div class="trade-card">
                    <div>
                        <span class="symbol">${trade.symbol}</span> 
                        <span class="${isLong ? 'badge-long' : 'badge-short'}">${isLong ? 'شراء LONG' : 'بيع SHORT'}</span>
                    </div>
                    <hr style="border: 0; border-top: 1px solid #1F293D; margin: 10px 0;">
                    <p style="margin: 6px 0;">سعر الدخول: <b>${trade.entry}</b></p>
                    <p style="margin: 6px 0;">وقف الخسارة: <b style="color: #EA3943;">${trade.stop_loss}</b></p>
                    <div style="font-size: 13px; color: #FFC107; margin-top: 8px;">الأهداف: ${Array.isArray(trade.targets) ? trade.targets.join(' - ') : trade.targets}</div>
                </div>
            `;
        });
    }

    // جلب التوصيات الحالية فور فتح التطبيق
    async function fetchInitialTrades() {
        const { data, error } = await _supabase.from('trades').select('*').order('created_at', { ascending: false });
        if (!error) {
            renderTrades(data);
        }
    }

    // تفعيل الاستماع المباشر (Realtime): أي إشارة جديدة تدخل القاعدة ستظهر فوراً على الشاشة دون الحاجة لتحديث الصفحة
    _supabase
        .channel('public:trades')
        .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'trades' }, payload => {
            console.log('تم استلام صفقة جديدة مباشرة:', payload.new);
            fetchInitialTrades(); // إعادة تحديث القائمة تلقائياً لإظهار الصفقة الجديدة بالأعلى
        })
        .subscribe();

    // تشغيل الجلب الأولي عند فتح التطبيق
    fetchInitialTrades();
</script>

</body>
</html>
