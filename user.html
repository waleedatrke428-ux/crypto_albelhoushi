<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Crypto Albelhoushi - منصة التوصيات الذكية</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='50' r='48' fill='%230f172a' stroke='%23f59e0b' stroke-width='4'/><path d='M35 30 L65 30 M35 50 L60 50 M35 70 L65 70 M45 20 L45 80' stroke='%23f59e0b' stroke-width='6' stroke-linecap='round'/></svg>">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script type="text/javascript" src="https://s3.tradingview.com/tv.js"></script>
    <style>
        :root {
            --bg-dark: #090d16;
            --card-bg: #131c2e;
            --accent-gold: #f59e0b;
            --green: #10b981;
            --red: #ef4444;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
        }
        * { user-select: none; -webkit-user-select: none; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-dark);
            color: var(--text-main);
            margin: 0; padding: 12px; padding-bottom: 70px;
        }
        .card {
            background-color: var(--card-bg);
            border-radius: 16px; padding: 16px; margin-bottom: 16px;
            border: 1px solid #1e293b; box-shadow: 0 4px 15px rgba(0,0,0,0.3);
        }
        input, button {
            width: 100%; padding: 12px; margin: 8px 0; border-radius: 8px;
            border: 1px solid #334155; background-color: #0f172a; color: white; font-size: 0.9rem;
        }
        button { background-color: var(--accent-gold); color: #000; font-weight: bold; cursor: pointer; border: none; }
        .badge { display: inline-block; padding: 4px 12px; border-radius: 20px; font-size: 0.85rem; font-weight: bold; background: rgba(245,158,11,0.15); color: var(--accent-gold); border: 1px solid var(--accent-gold); }
        .chart-box { height: 260px; border-radius: 10px; overflow: hidden; margin-top: 10px; }
        .dev-footer {
            position: fixed; bottom: 0; left: 0; right: 0;
            background: #0f172a; border-top: 1px solid #1e293b;
            text-align: center; padding: 10px; font-size: 0.8rem;
            color: var(--accent-gold); font-weight: bold; z-index: 1000;
        }
    </style>
</head>
<body oncontextmenu="return false;">

    <div id="authScreen" class="card" style="max-width: 400px; margin: 40px auto; text-align: center;">
        <h2 style="color: var(--accent-gold);">⚡ Crypto Albelhoushi</h2>
        <p style="color: var(--text-muted); font-size: 0.9rem;">تسجيل الدخول أو إنشاء حساب جديد (فترة تجريبية 5 أيام)</p>
        <input type="email" id="email" placeholder="البريد الإلكتروني">
        <input type="password" id="password" placeholder="كلمة المرور">
        <button onclick="handleLogin()">تسجيل الدخول / إنشاء حساب</button>
        <div id="authMsg" style="color: var(--red); font-size: 0.85rem; margin-top: 10px;"></div>
    </div>

    <div id="appInterface" style="display: none;">
        <div class="card" style="text-align: center;">
            <h2 style="margin:0; color:var(--accent-gold);">⚡ لوحة التوصيات الحية</h2>
            <div id="userBadge" class="badge">جاري التحقق من الاشتراك...</div>
            <button onclick="handleLogout()" style="background: transparent; color: var(--red); border: 1px solid var(--red); width: auto; padding: 6px 15px; margin-top: 10px; font-size: 0.8rem;">تسجيل الخروج</button>
        </div>

        <div id="signalsFeed"></div>
    </div>

    <div class="dev-footer">
        حقوق التطوير محفوظة للمطور: وليد تركي الحمد ©
    </div>

    <script>
        const SUPABASE_URL = 'https://gdsnaivwndtuqktzrbin.supabase.co';
        const SUPABASE_KEY = 'Sb_publishable_VbgMS_Y_oNs8rbMhVs1Tpg_9GJbP-gl';
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        supabaseClient.auth.getSession().then(({ data: { session } }) => {
            if (session) {
                showApp(session.user);
            }
        });

        async function handleLogin() {
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            document.getElementById('authMsg').innerText = '';

            if(!email || !password) {
                document.getElementById('authMsg').innerText = 'الرجاء إدخال البريد وكلمة المرور';
                return;
            }

            let { data, error } = await supabaseClient.auth.signInWithPassword({ email, password });
            
            if (error) {
                let { data: signUpData, error: signUpError } = await supabaseClient.auth.signUp({ email, password });
                if (signUpError) {
                    document.getElementById('authMsg').innerText = signUpError.message;
                } else {
                    alert('✨ تم إنشاء الحساب بنجاح وتم منحك فترة تجريبية لمدة 5 أيام!');
                    showApp(signUpData.user);
                }
            } else {
                showApp(data.user);
            }
        }

        function showApp(user) {
            document.getElementById('authScreen').style.display = 'none';
            document.getElementById('appInterface').style.display = 'block';
            document.getElementById('userBadge').innerText = `حالة الحساب: مفعل (فترة تجريبية / مشترك)`;
            fetchSignals();
        }

        async function handleLogout() {
            await supabaseClient.auth.signOut();
            location.reload();
        }

        async function fetchSignals() {
            const feed = document.getElementById('signalsFeed');
            let { data: signals, error } = await supabaseClient.from('signals').select('*').order('created_at', { ascending: false });
            
            if (error || !signals || signals.length === 0) {
                feed.innerHTML = '<div class="card" style="text-align:center; color:var(--text-muted);">لا توجد صفقات منشورة حالياً. بانتظار إرسال المدير للصفقات القادمة...</div>';
                return;
            }

            feed.innerHTML = '';
            signals.forEach((sig, index) => {
                let cardId = 'tv-chart-' + index;
                let symbol = sig.symbol || 'BTC/USDT';
                feed.innerHTML += `
                    <div class="card">
                        <div style="display:flex; justify-content:space-between; align-items:center; border-bottom:1px solid #1e293b; padding-bottom:8px; margin-bottom:10px;">
                            <span style="font-weight:bold; font-size:1.1rem; color:var(--accent-gold);">${symbol}</span>
                            <span style="padding:4px 10px; border-radius:6px; font-size:0.8rem; font-weight:bold; background:rgba(16,185,129,0.2); color:var(--green);">الصفقة قائمة</span>
                        </div>
                        <div style="display:grid; grid-template-columns:1fr 1fr; gap:8px; font-size:0.85rem; margin-bottom:10px;">
                            <div style="background:rgba(15,23,42,0.6); padding:8px; border-radius:6px;">سعر الدخول: <b>${sig.entry_price || '--'}</b></div>
                            <div style="background:rgba(15,23,42,0.6); padding:8px; border-radius:6px;">وقف الخسارة: <b style="color:var(--red);">${sig.stop_loss || '--'}</b></div>
                        </div>
                        <div style="background:rgba(15,23,42,0.6); padding:8px; border-radius:6px; font-size:0.85rem; margin-bottom:10px;">الأهداف: <b style="color:var(--green);">${sig.take_profit || '--'}</b></div>
                        <div style="background:rgba(59,130,246,0.1); border-right:3px solid #3b82f6; padding:8px; border-radius:4px; font-size:0.8rem; color:#93c5fd;">الفريم: ${sig.timeframe || '15M'}</div>
                        <div id="${cardId}" class="chart-box"></div>
                    </div>
                `;
                
                setTimeout(() => {
                    new TradingView.widget({
                        "autosize": true,
                        "symbol": "BINANCE:" + symbol.replace('/', ''),
                        "interval": "15",
                        "theme": "dark",
                        "style": "1",
                        "locale": "ar",
                        "enable_publishing": false,
                        "hide_side_toolbar": true,
                        "container_id": cardId
                    });
                }, 100);
            });
        }

        document.addEventListener('keyup', (e) => {
            if (e.key == 'PrintScreen') {
                navigator.clipboard.writeText('');
                alert('عذراً، محتوى هذا التطبيق محمي ضد التقاط الشاشة أو المشاركة!');
            }
        });
    </script>
</body>
    </html>
