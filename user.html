<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منصة التوصيات الذكية</title>
    <!-- مكتبة Supabase للاتصال بقاعدة البيانات -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { font-family: Tahoma, sans-serif; background: #0b0f19; color: #fff; margin: 0; padding: 20px; }
        .container { max-width: 600px; margin: 0 auto; background: #161b22; padding: 20px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.5); }
        h1, h2 { color: #00E5FF; text-align: center; }
        .card { background: #21262d; padding: 15px; margin: 10px 0; border-radius: 8px; border: 1px solid #30363d; }
        button { background: #00E5FF; color: #0b0f19; border: none; padding: 10px 15px; border-radius: 6px; cursor: pointer; font-weight: bold; width: 100%; margin-top: 10px; }
        button:hover { background: #00b8cc; }
        input { width: 100%; padding: 10px; margin: 8px 0; background: #0d1117; border: 1px solid #30363d; color: #fff; border-radius: 6px; box-sizing: border-box; }
        .locked { filter: blur(5px); user-select: none; }
        .lock-message { color: #ff5252; text-align: center; font-weight: bold; margin-top: 10px; }
    </style>
</head>
<body>

    <div class="container" id="app">
        <h1>منصة التوصيات</h1>
        
        <!-- قسم تسجيل الدخول / إنشاء حساب -->
        <div id="auth-section" class="card">
            <h2>تسجيل الدخول</h2>
            <input type="email" id="email" placeholder="البريد الإلكتروني">
            <input type="password" id="password" placeholder="كلمة المرور">
            <button onclick="handleLogin()">دخول / تسجيل جديد</button>
        </div>

        <!-- قسم التوصيات (يظهر بعد تسجيل الدخول) -->
        <div id="dashboard-section" style="display:none;">
            <div class="card">
                <p id="sub-status" style="font-weight: bold; color: #4caf50;"></p>
            </div>
            
            <h2>التوصيات الحية</h2>
            <div id="trades-list">
                <!-- سيتم جلب التوصيات هنا ديناميكياً -->
            </div>
            <button onclick="handleLogout()" style="background: #f85149; margin-top: 20px;">تسجيل الخروج</button>
        </div>
    </div>

    <script>
        // ضع هنا بيانات مشروعك من Supabase
        const SUPABASE_URL = 'https://gdsnaivwmdbuqktzrbin.supabase.co';
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imdkc25aiXZ3bWRidXFrdHpyYmluIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTIxODI0NzAsImV4cCI6MjEwNzc1ODQ3MH0.cYsHuTE7XL8rR9M5PWIDPZhmE8Ntfvcnxdw5McR_f5w';
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        async function handleLogin() {
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            
            // محاولة تسجيل الدخول
            let { data, error } = await supabaseClient.auth.signInWithPassword({ email, password });
            if (error) {
                // إذا لم يكن الحساب موجوداً، نقوم بإنشائه تلقائياً
                let signUpRes = await supabaseClient.auth.signUp({ email, password });
                if (signUpRes.error) {
                    alert('خطأ: ' + signUpRes.error.message);
                    return;
                }
                alert('تم إنشاء الحساب وتسجيل الدخول بنجاح!');
            }
            checkUserSession();
        }

        async function checkUserSession() {
            const { data: { session } } = await supabaseClient.auth.getSession();
            if (session) {
                document.getElementById('auth-section').style.display = 'none';
                document.getElementById('dashboard-section').style.display = 'block';
                loadUserDataAndTrades(session.user.id);
            }
        }

        async function loadUserDataAndTrades(userId) {
            // جلب بيانات ملف المستخدم لفحص فترة التجربة 5 أيام والاشتراك
            let { data: profile } = await supabaseClient.from('profiles').select('*').eq('id', userId).single();
            
            let isAllowed = false;
            if (profile) {
                const now = new Date();
                const trialEnd = new Date(profile.trial_ends_at);
                if (profile.is_subscribed || now < trialEnd) {
                    isAllowed = true;
                    document.getElementById('sub-status').innerText = 'حالتك: لديك صلاحية الوصول النشطة (تجربة أو اشتراك)';
                } else {
                    document.getElementById('sub-status').innerText = 'انتهت فترتك التجريبية (5 أيام)، يرجى الاشتراكات لعرض التفاصيل';
                    document.getElementById('sub-status').style.color = '#ff5252';
                }
            }

            // جلب التوصيات من الجدول
            let { data: trades } = await supabaseClient.from('trades').select('*').order('created_at', { ascending: false });
            
            const listDiv = document.getElementById('trades-list');
            listDiv.innerHTML = '';
            
            if (trades && trades.length > 0) {
                trades.forEach(trade => {
                    const tradeCard = document.createElement('div');
                    tradeCard.className = 'card';
                    
                    if (isAllowed) {
                        tradeCard.innerHTML = `
                            <h3>${trade.symbol} (${trade.is_long ? 'شراء 🟢' : 'بيع 🔴'})</h3>
                            <p>سعر الدخول: ${trade.entry}</p>
                            <p>وقف الخسارة: ${trade.stop_loss}</p>
                        `;
                    } else {
                        tradeCard.innerHTML = `
                            <h3>توصية مميزة (مغلقة)</h3>
                            <div class="locked">
                                <p>سعر الدخول: مخفي</p>
                                <p>وقف الخسارة: مخفي</p>
                            </div>
                            <div class="lock-message">🔒 اشتَرِ المنصة لفك قفل التوصيات</div>
                        `;
                    }
                    listDiv.appendChild(tradeCard);
                });
            } else {
                listDiv.innerHTML = '<p style="text-align:center;">لا توجد توصيات حالياً</p>';
            }
        }

        async function handleLogout() {
            await supabaseClient.auth.signOut();
            location.reload();
        }

        // تنفيذ فحص الجلسة عند فتح الصفحة
        checkUserSession();
    </script>
</body>
</html>
