<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منصة الصفقات الذكية - Crypto Albelhoushi</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: { colors: { darkBg: '#0b0e11', cardBg: '#1e2329', accentGreen: '#0ecb81', accentRed: '#f6465d' } }
            }
        }
    </script>
    <style>
        body { -webkit-user-select: none; user-select: none; }
        #dynamic-watermark {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none; z-index: 9999; overflow: hidden; opacity: 0.08;
            font-size: 14px; color: #ffffff; display: flex; flex-wrap: wrap;
            justify-content: space-around; align-content: space-around; transform: rotate(-15deg);
        }
    </style>
</head>
<body class="bg-darkBg text-gray-100 font-sans min-h-screen pb-20">
    <div id="dynamic-watermark"></div>

    <div id="auth-modal" class="fixed inset-0 bg-darkBg/95 z-50 flex items-center justify-center p-4">
        <div class="bg-cardBg border border-gray-800 rounded-3xl p-6 w-full max-w-md shadow-2xl space-y-5">
            <div class="text-center space-y-2">
                <div class="w-14 h-14 bg-gradient-to-tr from-yellow-500 to-emerald-500 rounded-2xl mx-auto flex items-center justify-center shadow-lg">
                    <i class="fa-solid fa-shield-halved text-darkBg text-2xl"></i>
                </div>
                <h2 class="text-xl font-bold text-white">تسجيل الدخول للمنصة الآمنة</h2>
                <p class="text-xs text-gray-400">أدخل بريدك الإلكتروني لتفعيل الفترة التجريبية (5 أيام)</p>
            </div>
            <form id="login-form" class="space-y-4">
                <div>
                    <label class="block text-xs text-gray-400 mb-1">البريد الإلكتروني</label>
                    <input type="email" id="user-email" required class="w-full bg-darkBg border border-gray-700 rounded-xl p-3 text-sm text-white focus:border-emerald-500 focus:outline-none" placeholder="name@example.com">
                </div>
                <button type="submit" class="w-full bg-gradient-to-r from-emerald-600 to-teal-600 text-white font-bold py-3.5 rounded-xl shadow-lg hover:opacity-90 transition-all">
                    بدء التداول الفوري
                </button>
            </form>
        </div>
    </div>

    <header class="bg-cardBg border-b border-gray-800 p-4 sticky top-0 z-40 flex justify-between items-center shadow-md">
        <div class="flex items-center space-x-3 space-x-reverse">
            <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-yellow-500 to-emerald-500 flex items-center justify-center shadow-lg">
                <i class="fa-solid fa-chart-line text-darkBg text-xl"></i>
            </div>
            <div>
                <h1 class="font-bold text-sm text-white">Crypto Albelhoushi AI</h1>
                <p class="text-xs text-emerald-400 font-medium">تجربة مجانية نشطة</p>
            </div>
        </div>
    </header>

    <main class="max-w-4xl mx-auto p-4 space-y-6 mt-2">
        <section class="space-y-4">
            <h2 class="text-base font-bold text-white flex items-center">
                <i class="fa-solid fa-bolt text-yellow-400 ml-2"></i> صفقات الذكاء الاصطناعي الحية
            </h2>
            <div id="signals-container" class="space-y-4">
                <div class="text-center py-10 text-gray-500">جاري جلب الصفقات...</div>
            </div>
        </section>
    </main>

    <script>
        const SUPABASE_URL = 'https://gdsnaivwmdbuqktzrbin.supabase.co';
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imdkc25haXZ3bWRidXFrdHpyYmluIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTIxODI0NzAsImV4cCI6MjEwNzc1ODQ3MH0.cYsHuTE7XL8rR9M5PWIDPZhmE8Ntfvcnxdw5McR_f5w';
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        let currentUserEmail = localStorage.getItem('active_user_email');

        document.getElementById('login-form').addEventListener('submit', (e) => {
            e.preventDefault();
            const email = document.getElementById('user-email').value;
            localStorage.setItem('active_user_email', email);
            currentUserEmail = email;
            initWatermark(email);
            document.getElementById('auth-modal').classList.add('hidden');
            fetchSignals();
        });

        if (currentUserEmail) {
            document.getElementById('auth-modal').classList.add('hidden');
            initWatermark(currentUserEmail);
            fetchSignals();
        }

        function initWatermark(email) {
            const wm = document.getElementById('dynamic-watermark');
            wm.innerHTML = '';
            for (let i = 0; i < 20; i++) {
                const span = document.createElement('span');
                span.innerText = email + ' - محمي';
                span.className = 'm-8 select-none';
                wm.appendChild(span);
            }
        }

        async function fetchSignals() {
            const container = document.getElementById('signals-container');
            const { data: signals, error } = await supabaseClient
                .from('signals')
                .select('*')
                .order('created_at', { ascending: false });

            if (error) {
                container.innerHTML = `<div class="text-center text-red-400 py-6">خطأ في جلب البيانات: ${error.message}</div>`;
                return;
            }

            if (!signals || signals.length === 0) {
                container.innerHTML = `<div class="text-center text-gray-500 py-10">لا توجد صفقات نشطة حالياً.</div>`;
                return;
            }

            container.innerHTML = '';
            signals.forEach(sig => {
                const isLong = sig.type === 'LONG';
                const badgeColor = isLong ? 'bg-emerald-950 text-emerald-400 border-emerald-800' : 'bg-red-950 text-red-400 border-red-800';

                const card = document.createElement('div');
                card.className = "bg-cardBg border border-gray-800 rounded-2xl p-5 shadow-xl space-y-4";
                card.innerHTML = `
                    <div class="flex justify-between items-center">
                        <div class="flex items-center space-x-2 space-x-reverse">
                            <span class="font-bold text-lg text-white">${sig.symbol || 'BTC/USDT'}</span>
                            <span class="text-xs px-2.5 py-1 rounded-lg border font-bold ${badgeColor}">${sig.type || 'LONG'}</span>
                        </div>
                        <span class="text-xs bg-yellow-500/20 text-yellow-400 border border-yellow-500/40 px-2.5 py-1 rounded-full font-bold">⭐ صفقة حية</span>
                    </div>
                    <div class="grid grid-cols-2 gap-2 text-center bg-darkBg/60 p-3 rounded-xl border border-gray-800">
                        <div>
                            <span class="block text-[10px] text-gray-400">سعر الدخول</span>
                            <span class="text-xs font-bold text-white font-mono">${sig.entry_price}</span>
                        </div>
                        <div>
                            <span class="block text-[10px] text-gray-400">أهداف الأرباح (TP)</span>
                            <span class="text-xs font-bold text-emerald-400 font-mono">${sig.take_profit}</span>
                        </div>
                    </div>
                `;
                container.appendChild(card);
            });
        }
    </script>
</body>
    </html>
