name: Build Both Flutter Apps APKs

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Java
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.x'
          channel: 'stable'

      # 1. بناء تطبيق المستخدمين (user_app)
      - name: Get dependencies for user_app
        run: cd apps/user_app && flutter pub get

      - name: Build user_app APK
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: cd apps/user_app && flutter build apk --release

      - name: Rename user_app APK
        run: mv apps/user_app/build/app/outputs/flutter-apk/app-release.apk apps/user_app/build/app/outputs/flutter-apk/user-app-release.apk

      # 2. بناء تطبيق المدير (admin_app)
      - name: Get dependencies for admin_app
        run: cd apps/admin_app && flutter pub get

      - name: Build admin_app APK
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: cd apps/admin_app && flutter build apk --release

      - name: Rename admin_app APK
        run: mv apps/admin_app/build/app/outputs/flutter-apk/app-release.apk apps/admin_app/build/app/outputs/flutter-apk/admin-app-release.apk

      # 3. رفع الملفين معاً للتحميل
      - name: Upload APKs Artifacts
        uses: actions/upload-artifact@v3
        with:
          name: all-flutter-apks
          path: |
            apps/user_app/build/app/outputs/flutter-apk/user-app-release.apk
            apps/admin_app/build/app/outputs/flutter-apk/admin-app-release.apk
