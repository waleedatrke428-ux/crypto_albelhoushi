name: Build Android APKs

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - app: user_app
            project: crypto_user
            artifact: crypto-user-apk
            label: "العملات المشفرة، كريبتو ألبلهوشي، ملف APK لمستخدم العملات المشفرة"
          - app: admin_app
            project: crypto_admin
            artifact: crypto-admin-apk
            label: "Crypto Albelhoushi Admin, crypto-admin-apk"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          cache: true

      - name: Generate Android project
        run: |
          mkdir -p _build
          flutter create --platforms=android --org com.albelhoushi --project-name ${{ matrix.project }} _build/${{ matrix.app }}

      - name: Install app source
        run: |
          cp apps/${{ matrix.app }}/pubspec.yaml _build/${{ matrix.app }}/pubspec.yaml
          cp -R apps/${{ matrix.app }}/lib/. _build/${{ matrix.app }}/lib/
          sed -i 's/android:label="[^"]*"/android:label="${{ matrix.label }}"/' _build/${{ matrix.app }}/android/app/src/main/AndroidManifest.xml
          if [ "${{ matrix.app }}" = "user_app" ]; then
            cp apps/user_app/android/MainActivity.kt _build/user_app/android/app/src/main/kotlin/com/albelhoushi/crypto_user/MainActivity.kt
          fi
          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path('_build/${{ matrix.app }}/android/app/build.gradle')
          if not p.exists():
              raise FileNotFoundError(f'Missing Android app build.gradle: {p}')
          text = p.read_text(encoding='utf-8')
          compile_sdk = re.compile(r'(?m)^([ \t]*)compileSdk(?:Version)?\s*(?:=\s*)?.*$')
          matches = list(compile_sdk.finditer(text))
          if len(matches) > 1:
              raise RuntimeError('Multiple compileSdk declarations found in generated app build.gradle')
          if matches:
              text = compile_sdk.sub(r'\g<1>compileSdkVersion 34', text, count=1)
          else:
              android_block = re.search(r'(?m)^([ \t]*)android\s*\{\s*$', text)
              if not android_block:
                  raise RuntimeError('android block not found in generated app build.gradle')
              insert_at = android_block.end()
              indent = android_block.group(1) + '    '
              text = text[:insert_at] + f'\n{indent}compileSdkVersion 34' + text[insert_at:]
          p.write_text(text, encoding='utf-8')

          settings = p.parents[1] / 'settings.gradle'
          if not settings.exists():
              raise FileNotFoundError(f'Missing Android settings.gradle: {settings}')
          settings_text = settings.read_text(encoding='utf-8')
          kotlin_plugin = re.compile(r"""(\bid\s+["']org\.jetbrains\.kotlin\.android["']\s+version\s+["'])[^"']+(["'])""")
          settings_text, replacements = kotlin_plugin.subn(
              r'\g<1>1.9.24\g<2>', settings_text, count=1
          )
          if replacements != 1:
              raise RuntimeError('Kotlin Android Gradle plugin declaration not found')
          settings.write_text(settings_text, encoding='utf-8')
          PY
      - name: Build release APK
        working-directory: _build/${{ matrix.app }}
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "Configure SUPABASE_URL and SUPABASE_ANON_KEY as GitHub Actions secrets."
            exit 1
          fi
          flutter pub get
          flutter build apk --release -t lib/main.dart \
            --dart-define=SUPABASE_URL="$SUPABASE_URL" \
            --dart-define=SUPABASE_ANON_KEY="$SUPABASE_ANON_KEY"

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: _build/${{ matrix.app }}/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error