<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>تطبيق المستخدمين - إشارات التداول</title>
    <style>
        body { font-family: Tahoma, sans-serif; background: #1a1a2e; color: #fff; padding: 20px; direction: rtl; }
        .container { max-width: 800px; margin: auto; }
        .signal-card { background: #16213e; padding: 20px; border-radius: 12px; margin-bottom: 20px; box-shadow: 0 4px 15px rgba(0,0,0,0.3); }
        .price-box { font-size: 24px; font-weight: bold; color: #4ecca3; margin: 10px 0; }
        .details { display: flex; justify-content: space-between; margin-top: 15px; font-size: 16px; }
        .chart-container { height: 300px; width: 100%; margin-top: 20px; border-radius: 8px; overflow: hidden; }
        h2 { text-align: center; }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script type="text/javascript" src="https://s3.tradingview.com/tv.js"></script>
</head>
<body>

<div class="container">
    <h2>الصفقات الحالية</h2>
    <div id="signalsList"></div>
</div>

<script>
    const SUPABASE_URL = 'https://gdsnaivwmdbuqktzrbin.supabase.co/rest/v1/';
    const SUPABASE_ANON_KEY = 'sb_publishable_VbgMS_Y_oNs8rbMhVs1Tpg_9GJbP-gl';
    
    const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    async function fetchSignals() {
        const { data, error } = await _supabase
            .from('signals')
            .select('*')
            .order('created_at', { ascending: false });

        if (error) {
            console.error('Error fetching signals:', error.message);
        } else {
            renderSignals(data);
        }
    }

    function renderSignals(signals) {
        const list = document.getElementById('signalsList');
        list.innerHTML = '';

        signals.forEach((signal, index) => {
            const card = document.createElement('div');
            card.className = 'signal-card';
            card.innerHTML = 
                <div class="price-box">صفقة عقود آجلة (BTC/USDT)</div>
                <div class="details">
                    <span>سعر الدخول: <strong>${signal.entry_price}</strong></span>
                    <span>الإطار الزمني: <strong>${signal.timeframe}</strong></span>
                </div>
                <div class="details">
                    <span>هدف الربح: <strong style="color: #28a745;">${signal.take_profit}</strong></span>
                    <span>وقف الخسارة: <strong style="color: #dc3545;">${signal.stop_loss}</strong></span>
                </div>
                <div class="details">
                    <span>سبب الدخول: <strong>ارتداد من منطقة دعم قوية وأوردر بلوك.</strong></span>
                </div>
                <div class="chart-container" id="chart-${index}"></div>
            ;
            list.appendChild(card);

            new TradingView.widget({
                "container_id": chart-${index},
                "width": "100%",
                "height": "100%",
                "symbol": "BINANCE:BTCUSDT",
                "interval": signal.timeframe,
                "timezone": "Etc/UTC",
                "theme": "dark",
                "style": "1",
                "locale": "ar",
                "toolbar_bg": "#f1f3f6",
                "enable_publishing": false,
                "allow_symbol_change": false,
                "hide_side_toolbar": true
            });
        });
    }

    fetchSignals();
</script>

</body>
</html>
